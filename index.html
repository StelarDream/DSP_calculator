<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSP Recipe Browser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Saira:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div id="app">
    <input type="checkbox" id="sidebar-toggle" class="sidebar-toggle-input">

    <header class="topbar">
      <label for="sidebar-toggle" class="menu-btn" aria-label="Toggle sidebar" aria-hidden="true">
        <span></span>
      </label>
      <img src="assets/dsp-icon.png" alt="" class="brand-icon">
      <h1>DSP Recipe Browser</h1>

    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="search-wrap">
          <input id="search" type="text" placeholder="Search items or buildings..." autocomplete="off">
        </div>
        <div class="tabs">
          <button class="tab-btn active" data-tab="item">Items</button>
          <button class="tab-btn" data-tab="building">Buildings</button>
        </div>
        <div class="filters" id="filters"></div>
        <div class="list" id="entity-list"></div>
      </aside>

      <label for="sidebar-toggle" class="sidebar-backdrop" aria-hidden="true"></label>

      <main class="detail" id="detail">
        <div class="empty-state">
          <p>Select an item or building on the left to see its recipe.</p>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>

</html>
