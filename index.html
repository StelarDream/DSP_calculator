<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSP Recipe Browser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1>DSP Recipe Browser</h1>
    <div class="search-wrap">
      <input id="search" type="text" placeholder="Search items or buildings..." autocomplete="off">
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="tabs">
        <button class="tab-btn active" data-tab="items">Items</button>
        <button class="tab-btn" data-tab="buildings">Buildings</button>
      </div>
      <div class="filters" id="item-filters">
        <button class="filter-chip active" data-filter="all">All</button>
        <button class="filter-chip" data-filter="raw">Raw</button>
        <button class="filter-chip" data-filter="crafted">Crafted</button>
      </div>
      <div class="list" id="entity-list"></div>
    </aside>

    <main class="detail" id="detail">
      <div class="empty-state">
        <p>Select an item or building on the left to see its recipe.</p>
      </div>
    </main>
  </div>
</div>
</body>
</html>
